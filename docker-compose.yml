services:
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    ports: ["8000:8000"]
    environment:
      WM_PRESET_DIR: /presets
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    ports: ["3000:3000"]
    environment:
      WM_BACKEND_URL: http://backend:8000
    depends_on: [backend]
